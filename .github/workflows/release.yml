name: Build and Release Movix (Android APK)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android local.properties
        run: |
          mkdir -p app/android
          echo "flutter.sdk=$FLUTTER_ROOT" > app/android/local.properties

      - name: Configure Android Signing & Keystore
        run: |
          mkdir -p app/android/app/keystore
          mkdir -p app/android/keystore
          if [ ! -f app/android/app/keystore/movix.jks ] || ! keytool -list -keystore app/android/app/keystore/movix.jks -storepass movix123456 -alias movix > /dev/null 2>&1; then
            echo "Generating valid release keystore with alias movix..."
            rm -f app/android/app/keystore/movix.jks
            keytool -genkeypair -v \
              -keystore app/android/app/keystore/movix.jks \
              -storepass movix123456 \
              -alias movix \
              -keypass movix123456 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Movix, OU=TwoPhim, O=Movix, C=VN" \
              -storetype PKCS12
          fi
          cp -f app/android/app/keystore/movix.jks app/android/keystore/movix.jks
          cat << 'EOF' > app/android/key.properties
          storePassword=movix123456
          keyPassword=movix123456
          keyAlias=movix
          storeFile=keystore/movix.jks
          EOF

      - name: Get Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK Release
        working-directory: app
        run: flutter build apk --release

      - name: Prepare Named APK
        id: prepare_apk
        run: |
          RAW_VER=$(grep '^version: ' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          ORIGINAL_APK=$(find app -type f -name "*release*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: Release APK not found!"
            find app -name "*.apk" || true
            exit 1
          fi
          TARGET_APK="Movix-${RAW_VER}.apk"
          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "Created named APK: $TARGET_APK"
          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build-android]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Version & Tag
        id: version_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
          else
            RAW_VER=$(grep '^version: ' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v${RAW_VER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "Assets to publish:"
          ls -lh release-assets/ || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: Movix Release ${{ steps.version_info.outputs.tag_name }}
          make_latest: true
          body: |
            ## Movix - Ứng dụng xem phim trực tuyến hiện đại (Flutter)
            
            ### 📦 Tải file cài đặt:
            - **Android (APK)**: Tải file `Movix-${{ steps.version_info.outputs.raw_version }}.apk` để cài đặt trực tiếp trên điện thoại hoặc Android TV.
            
            ---
            
            ### ✨ Những điểm mới & Cải tiến trong bản ${{ steps.version_info.outputs.tag_name }}:
            - **Thanh điều hướng nổi dạng viên thuốc (Floating Pill Bottom Bar)**: Thiết kế capsule lơ lửng phong cách iOS hiện đại với hiệu ứng kính mờ (Liquid Frosted Glass), active pill phát sáng và phản hồi rung xúc giác.
            - **Top Bar trong suốt đè lên Hero Banner (Mobile)**: Thanh tiêu đề trên mobile tràn viền hoàn toàn trong suốt đè lên ảnh nền Hero sắc nét kèm nút tìm kiếm và thông báo hình tròn kính mờ.
            - **Rail điều hướng trong suốt Tablet / Desktop**: Thanh rail bên trái chỉ icon lơ lửng trên ảnh nền Hero Banner, tối đa hóa không gian trải nghiệm phim.
            - **Chọn nhiều mục trong Danh sách & Lịch sử (Multi-select)**: Nhấn giữ để kích hoạt chế độ chọn 1, nhiều hoặc tất cả, xóa hàng loạt và tự động đồng bộ đám mây.
            - **Hiệu ứng & Tối ưu UX/UI toàn diện**: Skeleton shimmer, ảnh fade-in mượt, hiệu ứng nhấn co giãn (Press Scale 0.96), chuyển tab mượt mà, Hero transitions poster sang chi tiết.
            - **Chuẩn hóa Design System**: Đồng bộ màu đỏ thương hiệu Movix Red `#E50914`, kiểu chữ `Be Vietnam Pro` và loại bỏ hoàn toàn các màu không khớp chuẩn.
            - **Tối ưu hiệu năng & Bộ nhớ**: Tối ưu bộ nhớ đệm hình ảnh (memCache), giải phóng providers tự động (autoDispose), giảm tải CPU trình phát video.
            - **Chuyển đổi nguồn dữ liệu TMDb / KKPhim**: Chuyển đổi linh hoạt giữa kho phim Quốc tế TMDb và kho phim Vietsub KKPhim ngay tại Logo với giao diện tối giản.
          draft: false
          prerelease: false
          generate_release_notes: false
