name: Build and Release Movix APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android local.properties
        run: |
          mkdir -p app/android
          echo "flutter.sdk=$FLUTTER_ROOT" > app/android/local.properties

      - name: Get Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK Release
        working-directory: app
        run: flutter build apk --release

      - name: Determine Version and Prepare Named APK
        id: prepare_apk
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
          else
            RAW_VER=$(grep '^version: ' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v${RAW_VER}"
          fi
          
          ORIGINAL_APK=$(find . -type f -name "*release*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: Release APK not found!"
            find . -name "*.apk" || true
            exit 1
          fi
          
          TARGET_APK="Movix-${RAW_VER}.apk"
          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "Created named APK: $TARGET_APK from $ORIGINAL_APK"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VER}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: Movix Release ${{ steps.prepare_apk.outputs.tag_name }}
          make_latest: true
          body: |
            ## Movix - Ứng dụng xem phim trực tuyến hiện đại (Flutter)
            
            ### 📦 Tải file cài đặt:
            - **Android APK**: Tải file `Movix-${{ steps.prepare_apk.outputs.raw_version }}.apk` bên dưới để cài đặt trực tiếp trên điện thoại/TV Android.
            
            ### ✨ Tính năng & Cải tiến mới:
            - **Trình phát HLS thuần chất lượng cao**: Điều chỉnh độ phân giải thực tế (1080p FHD, 720p HD, 480p, Auto) và chuyển đổi tỷ lệ khung hình 16:9 / Zoom tràn viền.
            - **Tự động chuyển tập & Phím tắt**: Bổ sung phím tắt `N` (Tập tiếp), `P` (Tập trước), `Space`, các nút điều khiển trực quan.
            - **Tự động nhảy danh sách tập**: Ngăn kéo danh sách tập tự động mở đúng tab và cuộn đến tập đang phát.
            - **Lưu tiến trình xem (Tiếp tục xem)**: Khôi phục chính xác thời điểm xem dở, hiển thị nhãn "Tiếp tục Tập X".
            - **Giao diện Hero Banner tối ưu**: Hiển thị hoàn hảo trên điện thoại xoay ngang (iPhone 16 landscape) và các kích cỡ màn hình khác.
            - Hỗ trợ đăng nhập Google, lưu phim yêu thích, lọc phim theo thể loại, quốc gia, năm phát hành.
          draft: false
          prerelease: false
          generate_release_notes: false
