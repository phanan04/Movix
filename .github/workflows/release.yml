name: Build and Release Movix APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android local.properties
        run: |
          mkdir -p app/android
          echo "flutter.sdk=$FLUTTER_ROOT" > app/android/local.properties

      - name: Configure Android Signing & Keystore
        run: |
          mkdir -p app/android/app/keystore
          mkdir -p app/android/keystore
          # Kiểm tra nếu keystore movix.jks chưa có alias movix thì tự động tạo chuẩn bằng keytool
          if [ ! -f app/android/app/keystore/movix.jks ] || ! keytool -list -keystore app/android/app/keystore/movix.jks -storepass movix123456 -alias movix > /dev/null 2>&1; then
            echo "Generating valid release keystore with alias movix..."
            rm -f app/android/app/keystore/movix.jks
            keytool -genkeypair -v \
              -keystore app/android/app/keystore/movix.jks \
              -storepass movix123456 \
              -alias movix \
              -keypass movix123456 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Movix, OU=TwoPhim, O=Movix, C=VN" \
              -storetype PKCS12
          fi
          cp -f app/android/app/keystore/movix.jks app/android/keystore/movix.jks
          echo "Verifying keystore contents:"
          keytool -list -v -keystore app/android/app/keystore/movix.jks -storepass movix123456 -alias movix

          # Tạo file key.properties chuẩn
          cat << 'EOF' > app/android/key.properties
          storePassword=movix123456
          keyPassword=movix123456
          keyAlias=movix
          storeFile=keystore/movix.jks
          EOF

      - name: Get Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK Release
        working-directory: app
        run: flutter build apk --release

      - name: Determine Version and Prepare Named APK
        id: prepare_apk
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
          else
            RAW_VER=$(grep '^version: ' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v${RAW_VER}"
          fi
          
          ORIGINAL_APK=$(find . -type f -name "*release*.apk" | head -n 1)
          if [ -z "$ORIGINAL_APK" ]; then
            echo "Error: Release APK not found!"
            find . -name "*.apk" || true
            exit 1
          fi
          
          TARGET_APK="Movix-${RAW_VER}.apk"
          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "Created named APK: $TARGET_APK from $ORIGINAL_APK"
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VER}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: Movix Release ${{ steps.prepare_apk.outputs.tag_name }}
          make_latest: true
          body: |
            ## Movix - Ứng dụng xem phim trực tuyến hiện đại (Flutter)
            
            ### 📦 Tải file cài đặt:
            - **Android APK**: Tải file `Movix-${{ steps.prepare_apk.outputs.raw_version }}.apk` bên dưới để cài đặt trực tiếp trên điện thoại/TV Android.
            
            ### ✨ Tính năng & Cải tiến mới trong v1.0.7:
            - **Tích hợp TMDB thời gian thực**: Tra cứu tự động bổ sung Backdrop 4K, Poster HD, Diễn viên kèm ảnh chân dung và Điểm đánh giá chuẩn xác từ The Movie Database.
            - **Đồng nhất hệ màu (Đỏ, Trắng) & Phông chữ**: Toàn bộ nút hành động chính (Xem ngay, Tiếp tục xem, Bỏ qua mở đầu) sử dụng màu Đỏ Movix `#E50914` chuẩn thương hiệu; hệ thống chữ chuẩn hóa Be Vietnam Pro với độ tương phản cao.
            - **Tối ưu dung lượng APK & Hiệu năng**: Kích hoạt R8 Minification và ProGuard Resource Shrinking giảm kích thước file cài đặt; khởi động song song giúp mở ứng dụng nhanh chóng; nâng cấp cache ảnh 120MB chống giật lag.
            - **Cân đối bố cục giao diện**: Căn chỉnh màn hình chi tiết phim cân đối theo trục dọc, tối ưu hóa hiển thị trên mọi kích thước màn hình (Mobile, Tablet, Desktop, TV).
            - **Sửa lỗi ký danh (Keystore)**: Đồng bộ release keystore thống nhất, loại bỏ triệt để lỗi xung đột gói khi nâng cấp phiên bản.
            - **Trình phát HLS thuần & Quản lý tài khoản**: Điều chỉnh độ phân giải, lưu tiến trình xem, bảo mật và đổi mật khẩu an toàn.
          draft: false
          prerelease: false
          generate_release_notes: false
